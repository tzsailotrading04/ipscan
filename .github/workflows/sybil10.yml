name: sybil10
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          : > exits.txt
          while read -r p; do
            p=$(printf '%s' "$p" | tr -d '\r')
            [ -z "$p" ] && continue
            ip=$(curl -s --max-time 15 --proxy "http://$p" https://api.ipify.org || echo FAIL)
            echo "$p -> $ip"
            echo "$ip" >> exits.txt
          done < proxies10.txt
          echo "---"
          echo "distinct: $(sort -u exits.txt | wc -l)"
