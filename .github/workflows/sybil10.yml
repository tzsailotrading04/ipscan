name: sybil10
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          : > exits.txt
          while read -r p; do
            [ -z "$p" ] && continue
            curl -s --max-time 12 --proxy "http://$p" https://api.ipify.org >> exits.txt || echo FAIL >> exits.txt
            echo "$p -> $(tail -1 exits.txt)"
          done < proxies10.txt
          echo "---"
          echo "distinct: $(sort -u exits.txt | wc -l)"
