name: sybil10
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          n=0; : > exits.txt
          while read -r p; do
            [ -z "$p" ] && continue
            n=$((n+1))
            ip=$(curl -s --max-time 12 --proxy "http://$p" https://api.ipify.org || echo FAIL)
            echo "node $n  $p  ->  $ip"
            echo "$ip" >> exits.txt
          done < proxies10.txt
          echo "---"
          echo "nodes launched: $n"
          echo "distinct exits: $(sort -u exits.txt | wc -l)"
          sort -u exits.txt
